<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Escape Files</title>
  <script>
    const destination = new URL('./', location.href);
    const language = new URL(location.href).searchParams.get('lang');
    if (language) destination.searchParams.set('lang', language);
    destination.hash = /^#learn-[a-z-]+$/.test(location.hash) ? location.hash : '#learn';
    location.replace(destination);
  </script>
</head>
<body><a href="./#learn">The Escape Files</a></body>
</html>
